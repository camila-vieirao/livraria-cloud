trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: livraria
  ec2Host: SEU_IP_ELASTIC   # trocar pelo Elastic IP da EC2
  sshKey: vm-livraria-key.pem
  envFile: /home/ec2-user/cloud-gallery.env

resources:
  containers:
  - container: mysql
    image: mysql:8.0
    ports:
    - 3306:3306
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: livraria

stages:

# ---------- STAGE 1: BUILD ----------
- stage: Build
  displayName: 'Stage 1 - Build'
  jobs:
  - job: build
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        pip install -r requirements.txt
        flake8 app tests --max-line-length=120
        python -m compileall app
      displayName: 'Instalar dependencias, lint e compilacao'

# ---------- STAGE 2: TESTES E COBERTURA ----------
- stage: Testes
  displayName: 'Stage 2 - Testes e Cobertura'
  dependsOn: Build
  jobs:
  - job: testes
    services:
      mysql: mysql
    variables:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: livraria
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        pip install -r requirements.txt
        for i in $(seq 1 30); do
          python -c "import pymysql; pymysql.connect(host='127.0.0.1', port=3306, user='root', password='root').close()" && break
          sleep 2
        done
      displayName: 'Aguardar MySQL'
    - script: |
        pytest tests/unit --junitxml=unit-results.xml --cov=app.storage --cov-report=xml:coverage.xml --cov-fail-under=100
      displayName: 'Testes unitarios (Quality Gate: 100% de cobertura)'
    - script: |
        pytest tests/integration --junitxml=integration-results.xml
      displayName: 'Testes de integracao e banco'
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '*-results.xml'
    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: coverage.xml
        codeCoverageTool: Cobertura

# ---------- STAGE 3: BUILD DA IMAGEM E DEPLOY ----------
- stage: Deploy
  displayName: 'Stage 3 - Deploy na EC2'
  dependsOn: Testes
  condition: succeeded()
  jobs:
  - job: deploy
    steps:
    - checkout: self
    - task: DownloadSecureFile@1
      name: chave
      inputs:
        secureFile: $(sshKey)
    - script: |
        chmod 400 $(chave.secureFilePath)
        docker build --build-arg BUILD_ID=$(Build.BuildId) -t $(imageName):$(Build.BuildId) -t $(imageName):latest .
        docker save $(imageName):latest | gzip > livraria.tar.gz
        scp -o StrictHostKeyChecking=no -i $(chave.secureFilePath) livraria.tar.gz ec2-user@$(ec2Host):/home/ec2-user/
        ssh -o StrictHostKeyChecking=no -i $(chave.secureFilePath) ec2-user@$(ec2Host) "gunzip -c /home/ec2-user/livraria.tar.gz | docker load && docker rm -f livraria || true; docker run -d --name livraria --restart always --env-file $(envFile) -p 80:3000 $(imageName):latest && docker image prune -f"
      displayName: 'Build Docker, enviar e atualizar container'
    - script: |
        for i in $(seq 1 15); do
          if curl -fs http://$(ec2Host)/health; then
            echo ""
            echo "Aplicacao no ar (/health ok)"
            break
          fi
          if [ "$i" = "15" ]; then echo "Health check falhou"; exit 1; fi
          sleep 4
        done
        for i in $(seq 1 10); do
          if curl -fs http://$(ec2Host)/ready; then
            echo ""
            echo "Aplicacao pronta, banco conectado (/ready ok)"
            exit 0
          fi
          sleep 4
        done
        echo "Readiness check falhou (confira as variaveis do banco na EC2)"
        exit 1
      displayName: 'Validar deploy (health e readiness)'
    - script: |
        chmod 400 $(chave.secureFilePath)
        ssh -o StrictHostKeyChecking=no -i $(chave.secureFilePath) ec2-user@$(ec2Host) "docker ps --filter name=livraria && docker logs --tail 20 livraria"
      displayName: 'Evidencia: logs do container'
      condition: succeededOrFailed()
